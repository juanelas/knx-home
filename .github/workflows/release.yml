name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve-version:
    name: Resolve release version
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      checkout_ref: ${{ steps.version.outputs.checkout_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select version tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG_NAME="$(git tag --list 'v[0-9]*' --sort=-version:refname | sed -n '1p')"
            CHECKOUT_REF="$GITHUB_REF"
          else
            TAG_NAME="$GITHUB_REF_NAME"
            CHECKOUT_REF="$TAG_NAME"
          fi
          if [[ -z "$TAG_NAME" ]]; then
            echo "No version tag matching v* was found." >&2
            exit 1
          fi
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$CHECKOUT_REF" >> "$GITHUB_OUTPUT"

  android:
    name: Android APK
    needs: resolve-version
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-version.outputs.tag }}
      RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.checkout_ref }}
      - uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-36
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build APK
        run: |
          flutter build apk --release --build-name="$RELEASE_VERSION" --build-number="$GITHUB_RUN_NUMBER"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/knx-home-android-${RELEASE_TAG}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  ubuntu_2604:
    name: Ubnutu 26.04
    needs: resolve-version
    runs-on: ubuntu-26.04
    env:
      RELEASE_TAG: ${{ needs.resolve-version.outputs.tag }}
      RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.checkout_ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev imagemagick
      - run: flutter pub get
      - name: Build Linux bundle
        run: |
          flutter build linux --release --build-name="$RELEASE_VERSION" --build-number="$GITHUB_RUN_NUMBER"
          mkdir -p dist
          convert assets/app_icon.png -resize 512x512 build/linux/knx-home-512.png
          tar -czf "dist/knx-home-linux-${RELEASE_TAG}.tar.gz" -C build/linux/x64/release/bundle .
      - name: Build Debian package
        run: |
          VERSION="$RELEASE_VERSION"
          PACKAGE_DIR="build/linux/deb/knx-home_${VERSION}_amd64"
          mkdir -p "$PACKAGE_DIR/DEBIAN" "$PACKAGE_DIR/opt/knx-home" "$PACKAGE_DIR/usr/bin" "$PACKAGE_DIR/usr/share/applications" "$PACKAGE_DIR/usr/share/icons/hicolor/512x512/apps"
          cp -a build/linux/x64/release/bundle/. "$PACKAGE_DIR/opt/knx-home/"
          sed "s/^Version: .*/Version: ${VERSION}/" packaging/linux/deb/control > "$PACKAGE_DIR/DEBIAN/control"
          cp packaging/linux/knx-home.desktop "$PACKAGE_DIR/usr/share/applications/knx-home.desktop"
          cp build/linux/knx-home-512.png "$PACKAGE_DIR/usr/share/icons/hicolor/512x512/apps/knx-home.png"
          cat > "$PACKAGE_DIR/usr/bin/knx-home" <<'EOF'
          #!/bin/sh
          cd /opt/knx-home
          exec ./knx_home "$@"
          EOF
          chmod 755 "$PACKAGE_DIR/usr/bin/knx-home"
          dpkg-deb --build --root-owner-group "$PACKAGE_DIR" "dist/knx-home-${RELEASE_TAG}-ubuntu-26.04-amd64.deb"
      - uses: actions/upload-artifact@v7
        with:
          name: ubuntu2604
          path: dist/*
          if-no-files-found: error

  linux:
    name: Ubuntu 24.04, Snap and Flatpak
    needs: resolve-version
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.resolve-version.outputs.tag }}
      RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.checkout_ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev imagemagick
      - run: flutter pub get
      - name: Build Linux bundle
        run: |
          flutter build linux --release --build-name="$RELEASE_VERSION" --build-number="$GITHUB_RUN_NUMBER"
          mkdir -p dist
          convert assets/app_icon.png -resize 512x512 build/linux/knx-home-512.png
          tar -czf "dist/knx-home-linux-${RELEASE_TAG}.tar.gz" -C build/linux/x64/release/bundle .
      - name: Build Debian package
        run: |
          VERSION="$RELEASE_VERSION"
          PACKAGE_DIR="build/linux/deb/knx-home_${VERSION}_amd64"
          mkdir -p "$PACKAGE_DIR/DEBIAN" "$PACKAGE_DIR/opt/knx-home" "$PACKAGE_DIR/usr/bin" "$PACKAGE_DIR/usr/share/applications" "$PACKAGE_DIR/usr/share/icons/hicolor/512x512/apps"
          cp -a build/linux/x64/release/bundle/. "$PACKAGE_DIR/opt/knx-home/"
          sed "s/^Version: .*/Version: ${VERSION}/" packaging/linux/deb/control > "$PACKAGE_DIR/DEBIAN/control"
          cp packaging/linux/knx-home.desktop "$PACKAGE_DIR/usr/share/applications/knx-home.desktop"
          cp build/linux/knx-home-512.png "$PACKAGE_DIR/usr/share/icons/hicolor/512x512/apps/knx-home.png"
          cat > "$PACKAGE_DIR/usr/bin/knx-home" <<'EOF'
          #!/bin/sh
          cd /opt/knx-home
          exec ./knx_home "$@"
          EOF
          chmod 755 "$PACKAGE_DIR/usr/bin/knx-home"
          dpkg-deb --build --root-owner-group "$PACKAGE_DIR" "dist/knx-home-${RELEASE_TAG}-ubuntu-24.04-amd64.deb"
      - name: Build Snap package
        run: |
          VERSION="$RELEASE_VERSION"
          mkdir -p packaging/linux/snap/app/usr/share/applications packaging/linux/snap/app/usr/share/icons/hicolor/512x512/apps
          cp -a build/linux/x64/release/bundle/. packaging/linux/snap/app/
          cp packaging/linux/knx-home.desktop packaging/linux/snap/app/usr/share/applications/knx-home.desktop
          cp build/linux/knx-home-512.png packaging/linux/snap/app/usr/share/icons/hicolor/512x512/apps/knx-home.png
          sed -i "s/^version: .*/version: '${VERSION}'/" packaging/linux/snap/snapcraft.yaml
          sudo snap install snapcraft --classic
          cd packaging/linux/snap
          sudo snapcraft pack --destructive-mode
          mv "knx-home_${VERSION}_amd64.snap" "../../../dist/knx-home-${RELEASE_TAG}-amd64.snap"
          cd ../../..
      - name: Build Flatpak package
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists --system flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --system --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
          mkdir -p packaging/linux/flatpak/app
          cp -a build/linux/x64/release/bundle/. packaging/linux/flatpak/app/
          cp packaging/linux/knx-home.desktop packaging/linux/flatpak/app/knx-home.desktop
          sed -i 's/^Icon=knx-home$/Icon=com.juanelas.knx_home/' packaging/linux/flatpak/app/knx-home.desktop
          cp packaging/linux/flatpak/com.juanelas.knx_home.metainfo.xml packaging/linux/flatpak/app/com.juanelas.knx_home.metainfo.xml
          cp build/linux/knx-home-512.png packaging/linux/flatpak/app/knx-home.png
          cat > packaging/linux/flatpak/app/knx-home-launcher <<'EOF'
          #!/bin/sh
          cd /app/lib/knx-home
          exec ./knx_home "$@"
          EOF
          chmod 755 packaging/linux/flatpak/app/knx-home-launcher
          flatpak-builder --force-clean --user --build-only build/linux/flatpak/build packaging/linux/flatpak/com.juanelas.knx_home.yml
          flatpak build-finish build/linux/flatpak/build --command=knx-home --share=ipc --share=network --socket=x11 --socket=wayland --device=dri --filesystem=home
          flatpak build build/linux/flatpak/build appstreamcli compose --origin=com.juanelas.knx_home --prefix=/ --result-root=/app --data-dir=/app/share/app-info/xmls --icons-dir=/app/share/app-info/icons/flatpak --no-net /app
          flatpak build-export --update-appstream build/linux/flatpak/repo build/linux/flatpak/build stable
          flatpak build-update-repo build/linux/flatpak/repo
          flatpak build-bundle build/linux/flatpak/repo "dist/knx-home-${RELEASE_TAG}-amd64.flatpak" com.juanelas.knx_home stable --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows
    needs: resolve-version
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-version.outputs.tag }}
      RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.checkout_ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows bundle
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          flutter build windows --release --build-name=$version --build-number=$env:GITHUB_RUN_NUMBER
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "dist/knx-home-windows-$env:RELEASE_TAG.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  ios:
    name: iOS unsigned archive
    needs: resolve-version
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-version.outputs.tag }}
      RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.checkout_ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build unsigned iOS archive
        run: |
          flutter build ipa --release --no-codesign --build-name="$RELEASE_VERSION" --build-number="$GITHUB_RUN_NUMBER"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/ios/archive/Runner.xcarchive "dist/knx-home-ios-${RELEASE_TAG}.xcarchive.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS
    needs: resolve-version
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-version.outputs.tag }}
      RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.checkout_ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build macOS app
        run: |
          flutter build macos --release --build-name="$RELEASE_VERSION" --build-number="$GITHUB_RUN_NUMBER"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/knx_home.app "dist/knx-home-macos-${RELEASE_TAG}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [resolve-version, android, linux, windows, ios, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create release and upload builds
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.resolve-version.outputs.tag }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/* --clobber
          else
            gh release create "$TAG_NAME" dist/* --generate-notes --title "$TAG_NAME"
          fi
