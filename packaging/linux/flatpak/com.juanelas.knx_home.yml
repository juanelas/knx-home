app-id: com.juanelas.knx_home
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: knx-home
appstream-compose: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
modules:
  - name: knx-home
    buildsystem: simple
    build-commands:
      - install -D -m 755 knx-home-launcher /app/bin/knx-home
      - install -D -m 755 knx_home /app/lib/knx-home/knx_home
      - cp -a data lib /app/lib/knx-home/
      - install -D -m 644 knx-home.desktop /app/share/applications/com.juanelas.knx_home.desktop
      - install -D -m 644 knx-home.png /app/share/icons/hicolor/512x512/apps/com.juanelas.knx_home.png
      - install -D -m 644 com.juanelas.knx_home.metainfo.xml /app/share/metainfo/com.juanelas.knx_home.metainfo.xml
    sources:
      - type: dir
        path: app
